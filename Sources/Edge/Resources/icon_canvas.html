<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px;
    height: 1024px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
</style>
</head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Shadow -->
    <filter id="appShadow" x="40" y="50" width="944" height="944" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Neon Glow Filters -->
    <filter id="cyanGlow" x="700" y="100" width="300" height="824" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="amberGlow" x="100" y="100" width="300" height="824" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="iconSoftGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Base Squircle Gradients -->
    <linearGradient id="basePlateGrad" x1="100" y1="100" x2="924" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E232E"/>
      <stop offset="40%" stop-color="#12151B"/>
      <stop offset="100%" stop-color="#0A0C10"/>
    </linearGradient>

    <linearGradient id="rimHighlight" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="75%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Trackpad Recess Gradient -->
    <linearGradient id="trackpadGrad" x1="512" y1="180" x2="512" y2="844" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171A23"/>
      <stop offset="100%" stop-color="#0E1017"/>
    </linearGradient>

    <!-- Left Slider (Brightness) Gradients -->
    <linearGradient id="amberTrackGrad" x1="210" y1="780" x2="210" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>

    <linearGradient id="amberPillGrad" x1="190" y1="360" x2="230" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Right Slider (Volume) Gradients -->
    <linearGradient id="cyanTrackGrad" x1="814" y1="780" x2="814" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#0EA5E9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>

    <linearGradient id="cyanPillGrad" x1="794" y1="460" x2="834" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Bottom Media Strip Gradient -->
    <linearGradient id="mediaTrackGrad" x1="300" y1="820" x2="724" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- 1. Master macOS Squircle with Shadow -->
  <g filter="url(#appShadow)">
    <rect x="100" y="100" width="824" height="824" rx="188" fill="url(#basePlateGrad)"/>
    <rect x="100" y="100" width="824" height="824" rx="188" stroke="url(#rimHighlight)" stroke-width="3" fill="none"/>
  </g>

  <!-- 2. Inner Recessed Trackpad Slate -->
  <rect x="180" y="180" width="664" height="664" rx="130" fill="url(#trackpadGrad)" stroke="#262B38" stroke-width="2"/>
  <rect x="182" y="182" width="660" height="660" rx="128" stroke="#000000" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Subtle Trackpad Texture Grid / Dots (Iconsax Technical Vibe) -->
  <g opacity="0.15">
    <circle cx="512" cy="512" r="3" fill="#94A3B8"/>
    <circle cx="452" cy="512" r="2.5" fill="#94A3B8"/>
    <circle cx="572" cy="512" r="2.5" fill="#94A3B8"/>
    <circle cx="512" cy="452" r="2.5" fill="#94A3B8"/>
    <circle cx="512" cy="572" r="2.5" fill="#94A3B8"/>
  </g>

  <!-- 3. Left Edge: Brightness Slider Track & Glow -->
  <!-- Ambient glow line -->
  <path d="M 210 240 L 210 780" stroke="#F59E0B" stroke-width="14" stroke-linecap="round" opacity="0.25" filter="url(#amberGlow)"/>
  <!-- Physical track groove -->
  <path d="M 210 240 L 210 780" stroke="#101319" stroke-width="12" stroke-linecap="round"/>
  <!-- Active illumination fill -->
  <path d="M 210 400 L 210 780" stroke="url(#amberTrackGrad)" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Left Slider Thumb Pill -->
  <g filter="url(#iconSoftGlow)">
    <rect x="194" y="370" width="32" height="64" rx="16" fill="url(#amberPillGrad)" stroke="#FEF3C7" stroke-width="2"/>
    <!-- Pill center indicator grip -->
    <line x1="202" y1="402" x2="218" y2="402" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Iconsax Two-Tone Sun Icon at Top-Left -->
  <g transform="translate(192, 230)" filter="url(#iconSoftGlow)">
    <!-- Sun Center -->
    <circle cx="18" cy="18" r="8" fill="#FDE047" fill-opacity="0.9"/>
    <circle cx="18" cy="18" r="8" stroke="#F59E0B" stroke-width="2.5"/>
    <circle cx="18" cy="18" r="4" fill="#FFFFFF"/>
    <!-- Two-tone decorative rays -->
    <path d="M 18 3 L 18 7" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 18 29 L 18 33" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 3 18 L 7 18" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 29 18 L 33 18" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 7.4 7.4 L 10.2 10.2" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M 25.8 25.8 L 28.6 28.6" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M 7.4 28.6 L 10.2 25.8" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M 25.8 10.2 L 28.6 7.4" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- 4. Right Edge: Volume Slider Track & Glow -->
  <!-- Ambient glow line -->
  <path d="M 814 240 L 814 780" stroke="#0284C7" stroke-width="14" stroke-linecap="round" opacity="0.3" filter="url(#cyanGlow)"/>
  <!-- Physical track groove -->
  <path d="M 814 240 L 814 780" stroke="#101319" stroke-width="12" stroke-linecap="round"/>
  <!-- Active illumination fill -->
  <path d="M 814 500 L 814 780" stroke="url(#cyanTrackGrad)" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Right Slider Thumb Pill -->
  <g filter="url(#iconSoftGlow)">
    <rect x="798" y="470" width="32" height="64" rx="16" fill="url(#cyanPillGrad)" stroke="#E0F2FE" stroke-width="2"/>
    <!-- Pill center indicator grip -->
    <line x1="806" y1="502" x2="822" y2="502" stroke="#0369A1" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Iconsax Two-Tone Speaker Icon at Top-Right -->
  <g transform="translate(796, 230)" filter="url(#iconSoftGlow)">
    <!-- Speaker Body -->
    <path d="M 12 11 L 6 15 L 2 15 L 2 21 L 6 21 L 12 25 Z" fill="#38BDF8" stroke="#0284C7" stroke-width="2" stroke-linejoin="round"/>
    <!-- Acoustic Sound Waves (Two-tone: light cyan & white) -->
    <path d="M 17 14 C 19 16 19 20 17 22" stroke="#BAE6FD" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M 22 10 C 26 14 26 22 22 26" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <path d="M 27 6 C 33 12 33 24 27 30" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- 5. Top-Right Corner: Quick Mute Touch Zone -->
  <circle cx="820" cy="204" r="14" fill="#F43F5E" fill-opacity="0.25"/>
  <circle cx="820" cy="204" r="6" fill="#F43F5E"/>
  <circle cx="820" cy="204" r="2.5" fill="#FFFFFF"/>

  <!-- 6. Bottom Edge: Media Strip -->
  <!-- Subtle track line -->
  <path d="M 320 820 L 704 820" stroke="url(#mediaTrackGrad)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Media Play/Pause Controls (Iconsax Two-Tone Aesthetic in Center) -->
  <g transform="translate(488, 804)" filter="url(#iconSoftGlow)">
    <!-- Play Pill Capsule -->
    <rect x="-30" y="-4" width="108" height="36" rx="18" fill="#1E1B2E" stroke="#7C3AED" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <!-- Previous Track (Two-tone arrows) -->
    <path d="M -16 14 L -10 9 L -10 19 Z" fill="#A78BFA" opacity="0.6"/>
    <line x1="-18" y1="9" x2="-18" y2="19" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Play / Pause in Center -->
    <polygon points="18,10 28,14 18,18" fill="#F3E8FF"/>
    <line x1="33" y1="10" x2="33" y2="18" stroke="#F3E8FF" stroke-width="2" stroke-linecap="round"/>
    <line x1="37" y1="10" x2="37" y2="18" stroke="#F3E8FF" stroke-width="2" stroke-linecap="round"/>

    <!-- Next Track -->
    <path d="M 64 14 L 58 9 L 58 19 Z" transform="rotate(180 61 14)" fill="#A78BFA" opacity="0.6"/>
    <line x1="66" y1="9" x2="66" y2="19" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- 7. Center Branding Emblem: Minimalist Iconsax Trackpad Silhouette -->
  <g transform="translate(422, 432)" opacity="0.88">
    <!-- Outer glass card -->
    <rect x="0" y="0" width="180" height="135" rx="28" fill="#131720" stroke="#334155" stroke-width="2.5"/>
    <rect x="2" y="2" width="176" height="131" rx="26" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.08" fill="none"/>
    
    <!-- Center divider subtle notch -->
    <line x1="90" y1="110" x2="90" y2="128" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Left edge slider highlight on mini card -->
    <line x1="10" y1="28" x2="10" y2="107" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Right edge slider highlight on mini card -->
    <line x1="170" y1="28" x2="170" y2="107" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Central Haptic Waves (Iconsax Two-Tone) -->
    <path d="M 68 67 C 76 60 84 60 90 67 C 96 74 104 74 112 67" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 74 54 C 80 49 86 49 90 54 C 94 59 100 59 106 54" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 74 80 C 80 75 86 75 90 80 C 94 85 100 85 106 80" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Top Glass Highlight Rim Reflections -->
  <path d="M 288 104 C 230 104 180 140 150 188 C 220 156 340 144 512 144 C 684 144 804 156 874 188 C 844 140 794 104 736 104 Z" fill="#FFFFFF" opacity="0.05"/>
</svg>
</body>
</html>
